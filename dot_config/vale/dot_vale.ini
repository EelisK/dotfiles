StylesPath = styles
MinAlertLevel = suggestion
Packages = Google, ai-tells, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
COMMIT_EDITMSG = md
go = md
py = md
java = md
scala = md
ts = md
tsx = md
js = md
jsx = md
lua = md
tex = txt

[*.{md,txt,rst,adoc,asciidoc,tex}]
BasedOnStyles = Google, ai-tells

[*.{go,py,java,scala,ts,tsx,js,jsx,lua}]
BasedOnStyles = Google, ai-tells

[{COMMIT_EDITMSG,.git/COMMIT_EDITMSG}]
BasedOnStyles = Google, ai-tells, ai-tells-commits
